# Standard _pkgdown.yml, written by washr::setup_website() from DESCRIPTION.
# `url` is the site base URL (canonical links, sitemap.xml, redirects), so it
# is the Pages URL, never the GitHub repository URL; the repository link lives
# in home.links below. The analytics header and the funding text come from
# the Config/washr fields in DESCRIPTION. washr keeps this file as it is on
# every later run.
url: https://openwashdata.github.io/guluswm/
template:
  bslib:
    brand: _brand.yml
  bootstrap: 5
  includes:
    in_header: |
      <script defer data-domain="openwashdata.github.io" src="https://plausible.io/js/script.js"></script>
  opengraph:
    image:
      src: https://raw.githubusercontent.com/openwashdata/brand/v1.1.0/assets/social-preview.png
      alt: openwashdata, social preview image

navbar:
  structure:
    right: [search, home, github, lightswitch]
  components:
    home:
      text: openwashdata.org
      href: https://openwashdata.org
      aria-label: openwashdata website

home:
  links:
    - icon: github
      text: GitHub repository
      href: https://github.com/openwashdata/guluswm
  sidebar:
    structure: [links, citation, authors, dev, custom, community]
    components:
      custom:
        title: Funding
        text: This project was funded by the [Open Research Data Program of the ETH Board](https://ethrat.ch/en/eth-domain/open-research-data/).
      community:
        title: openwashdata
        text: This package is part of [openwashdata](https://openwashdata.org). Browse the [data catalogue](https://openwashdata.org/pages/gallery/data/) or get the [newsletter](https://openwashdata.org/pages/newsletter/).

authors:
  footer:
    roles: [cre, fnd]
    text: "Crafted by"
  sidebar:
    roles: [cre, aut, ctb]
    before: "So *who* does the work?"
    after: "Thanks all!"

footer:
  structure:
    left: [developed_by, publisher]
    right: [washr, built_with]
  components:
    publisher: Published by [openwashdata](https://openwashdata.org), a project of [Global Health Engineering](https://ghe.ethz.ch/) at ETH Zurich.
    washr: Package built with [washr](https://openwashdata.github.io/washr/) 1.2.2.9000.

# One entry per data object in data/, each under its own descriptive name.
# Add every new data object here, or the site build stops.
reference:
- title: "Data"
  desc: "Access the guluswm datasets"
  contents:
  - guluswm_survey
  - guluswm_waste
